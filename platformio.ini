; PassManager — ESP32-S3, USB-NCM, без Wi-Fi.
;
; Единый источник истины для платы — board/esp32s3-16m8m.json:
;   -DARDUINO_USB_MODE=1, ARDUINO_USB_*_ON_BOOT=0  (build.extra_flags)
;   build.arduino.memory_type = qio_opi              (16 MB QD + 8 MB OPI PSRAM)
;   build.filesystem = littlefs
; Здесь эти флаги НЕ дублируются.
;
; Порты: CH343 (VID 1a86) = UART0 на GPIO43/44, логи и прошивка -> /dev/ttyACM0.
; Второй Type-C (native USB-OTG, VID 303a) занимает TinyUSB NCM.

[platformio]
boards_dir = board

[env:esp32s3-16m8m]
platform = espressif32@7.1.3
board = esp32s3-16m8m
framework = arduino

board_build.partitions = partitions.csv

upload_port = /dev/ttyACM0
monitor_port = /dev/ttyACM0
monitor_speed = 115200
monitor_dtr = 0
monitor_rts = 0

lib_ldf_mode = deep+
lib_deps = bblanchon/ArduinoJson@^7.2.0

; Цели из scripts/build_webfs.py:
;   pio run -t webfs      образ раздела web (LittleFS) из data/ + заливка в web
;   pio run -t uploadall  прошивка И образ web одной командой
; Свой скрипт нужен потому, что штатный uploadfs выбирает раздел образа по
; "последний data/spiffs" без break, а их в partitions.csv три (vault, logs,
; web) — порядок строк в таблице молча зашил бы статику в vault.
extra_scripts = scripts/build_webfs.py

; ВНИМАНИЕ: [env] build_flags применяются ПОСЛЕ build.extra_flags из board.json,
; поэтому любой -DARDUINO_USB_* здесь молча перебьёт board.json (last-wins).
; USB-флаги живут только в board/esp32s3-16m8m.json.
; Путь относительный: компилятор запускается из корня проекта.
;
; -iquote НАМЕРЕННО не в build_flags: тот флаг попадает и в компиляцию ядра
; Arduino (проверено: позиция 8 в командной строке USBCDC.cpp против 210 у
; arduino_tinyusb/include). Ядро использует свой tusb_config.h, где
; CFG_TUD_CDC=1, иначе USBCDC.cpp и USBMSC.cpp не компилируются. Наш
; NCM-only конфиг нужен ровно двум областям: нашим src/ и нашей библиотеке
; lib/tinyusb. -Wl,-Map нужен для Гейта А (разбор .map).
build_flags =
    -Wl,-Map
    -DCFG_TUD_CDC=0
    -DCFG_TUD_NCM=1
    -DCFG_TUD_ECM_RNDIS=0
    -DTINYUSB_USE_CUSTOM_DESCRIPTORS
    -DTUD_USE_CUSTOM_DEVICE_DESCRIPTOR=1
    -DTUD_USE_CUSTOM_CONFIG_DESCRIPTOR=1

build_src_flags =
    -iquote lib/tinyusb/src
